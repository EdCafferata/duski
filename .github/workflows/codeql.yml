name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  analyze-python:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:python

  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      # Autobuild ziet geen Swift-bronnen (Xcode synchronized folders); bouw expliciet via het scheme (ongesigneerd).
      - name: Build
        run: |
          xcodebuild build -project Duski.xcodeproj -scheme Duski \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
